<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENEM 2026 - Portal de Colaboradores</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Redireciona caminhos e parâmetros para a raiz com suporte completo a SPA
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?' +
        (l.pathname.slice(1) ? 'p=' + encodeURIComponent(l.pathname.slice(1)) : '') +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px;">
      <h2>Carregando portal ENEM 2026...</h2>
    </div>
  </body>
</html>
